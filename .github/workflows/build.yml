name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: app/build/outputs/apk/debug/app-debug.apk }
  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install PyAudioWPatch pyinstaller
      - run: pyinstaller --onefile --name btrx pc/btrx.py
      - uses: actions/upload-artifact@v4
        with: { name: btrx-exe, path: dist/btrx.exe }
